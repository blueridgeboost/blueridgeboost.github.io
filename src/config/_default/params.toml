#################### default parameters ################################
# Strip unused CSS in production builds. Wired to hugo_stats.json via
# postcss.config.js, applied only when hugo.IsProduction is true.
purge_css = true
# favicon
favicon = "images/brand/blue-ridge-highlands-cropped.png"
# logo
logo = "images/brand/blue-ridge-highlands-cropped.png"
logo_darkmode = "#"
# use `px` or `x` with logo_width = " example: "100px".
# Note: logo_width is not work with .svg file
logo_width = "80px"
# if logo_webp set false, will not generate WEBP version of logo | default is true
logo_webp = true
# logo text will only show when logo is missing.
logo_text = "Blue Ridge Boost"
theme_switcher = false
theme_default = "system" # available options [light/dark/system]
# Main Sections
mainSections = []
# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>"
custom_script = ""
# copyright
theme_copyright = true
copyright = "Copyright by Blue Ridge Boost"
math=true

# Site-wide default description (used as a fallback for <meta description>,
# og:description, and twitter:description when a page has none of its own).
description = "Hands-on STEM classes, robotics, coding, math, and summer camps for students ages 6–18 in Charlottesville, Virginia."

# ── New homepage params ──
brand_name = "Blue Ridge Boost"
address = "Charlottesville • 2171 Ivy Rd"
full_address = "2171 Ivy Rd • Charlottesville, VA 22903"
phone = "(434) 260‑0636"
phone_raw = "+14342600636"
email = "info@blueridgeboost.com"
tagline = "Hands-on STEM learning • Ages 6+"

# other email params
birthdayemail = "birthdays@blueridgeboost.com"
campemail = "camps@blueridgeboost.com"

# Promo strip (full-width band under topbar). Shown when promo_text is set.
# Clear promo_text to hide. promo_expires and promo_url are optional.
promo_text = "🦃 Thanksgiving savings: 20% off everything · Discount applied at checkout"
promo_expires = "Ends Nov 30, 2026"

######################### site variables ##############################
# customize your color and font from here.
# Palette: deep navy + warm amber.
[variables]
color_primary = "#0B2545"    # navy
color_secondary = "#3B6BA5"  # mid blue
body_color = "#fff"
text_color = "#4A5A72"       # muted blue-gray body copy
text_dark = "#0F1B2D"        # near-black for strong text
text_light = "#8794A8"
border_color = "#D9E1EC"
dark_body_color = "#1E262C"
dark_text_color = "#cbcbcb"
dark_text_light = "#959595"
dark_text_dark = "#fff"
dark_border_color = "#4e4e4e"
black = "#0F1B2D"
white = "#fff"
light = "#F5F1E8"            # warm cream surface
dark = "#0B2545"

# base font size for full website
font_size = "16px" # default is 16px

# Font Scale Sizes
# "minorSecond": 1.067,
# "majorSecond": 1.125,
# "minorThird": 1.2,
# "majorThird": 1.25,
# "perfectFourth": 1.333,
# "augmentedFourth": 1.414,
# "perfectFifth": 1.5,
# "goldenRatio": 1.618
font_scale = "1.25" # default is "majorThird": 1.25

# go to https://fonts.google.com/ to find the font you want to use. select your font and copy only the bold part from the URL. and paste it here.
# example: "Work+Sans:wght@400;500;600"
font_primary = "Urbanist:wght@500;600;700"
font_primary_type = "sans-serif"           # [serif/sans-serif]
font_secondary = "Poppins:wght@400;500"
font_secondary_type = "sans-serif"         # [serif/sans-serif]
font_icon = "Font Awesome 6 Free"          # https://fontawesome.com/v5.15/icons/

[cta]
text = "Explore Summer Camps"
url = "/summer-camps"

# preloader
# preloader module: https://github.com/gethugothemes/hugo-modules/tree/master/components/preloader
[preloader]
enable = true
preloader = "" # use jpg, png, svg or gif format. example - "images/preloader.gif"

# Navigation button
[navigation_button]
enable = false
label = "Get a Demo"
link = "get-demo/"

# crisp chat
# crisp chat module: https://github.com/gethugothemes/hugo-modules/tree/master/components/crisp-chat
[crisp_chat]
enable = false
crisp_website_id = "" # replace this code with yours

# seo meta data for OpenGraph / Twitter Card
[metadata]
author = "Blue Ridge Boost"
image = "images/brand/blue-ridge-highlands-cropped.png"

# matomo tracking: see https://matomo.org/
[matomo]
enable = false
url = ""
id = ""

# baidu analytics: see https://tongji.baidu.com/
[baidu]
enable = false
analytics_id = ""

# plausible analytics: see https://plausible.io/
[plausible]
enable = false
domain = ""

# counter analytics: see https://counter.dev/setup.html
[counter]
enable = false
username = ""

# site verifications
[site_verification]
google = "GT-TXZCPHS"
bing = ""
baidu = ""
facebook = ""
mastodon = ""


