{{ define "main" }}

<section class="camp-page-section">
  <div class="wrap">

    {{ with .Params.page_title }}
    <header class="camp-page__intro">
      <h1>{{ . | markdownify }}</h1>
      {{ with $.Params.page_subtitle }}
      <p>{{ . | markdownify }}</p>
      {{ end }}
    </header>
    {{ end }}

    <div class="camp-page-content">{{ .Content }}</div>
  </div>
</section>

<style>
/* ==========================================================================
   Camp page — matches the camps hub (/camps/) visual language
   ========================================================================== */

.camp-page-section {
  padding-block: clamp(1.25rem, 2.5vw, 1.75rem);
}

.camp-page__intro {
  max-width: 820px;
  margin: 0 auto 1.25rem;
  text-align: center;
}

.camp-page__intro h1 {
  margin: 0 0 0.4rem !important;
  color: #0b2545;
  font-size: clamp(1.5rem, 2.4vw, 2rem) !important;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -0.025em;
}

.camp-page__intro p {
  margin: 0;
  color: #52657a;
  font-size: 1rem !important;
  line-height: 1.5;
}

.camp-page-content {
  --camp-navy: #0b2545;
  --camp-blue: #3b6ba5;
  --camp-text: #0f1b2d;
  --camp-muted: #52657a;
  --camp-border: #d9e1ec;
  --camp-soft: #f5f8fc;
  --camp-bg: #ffffff;

  color: var(--camp-text);
}

/* Quick facts bar */
.camp-quick-facts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  margin-bottom: 1rem;
  background: var(--camp-border);
  border: 1px solid var(--camp-border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(11, 31, 63, 0.05);
}

.camp-fact {
  padding: 0.7rem 0.75rem;
  text-align: center;
  background: var(--camp-bg);
}

.camp-fact strong {
  display: block;
  color: var(--camp-navy);
  font-size: 0.95rem;
  font-weight: 800;
}

.camp-fact span {
  display: block;
  margin-top: 0.3rem;
  color: var(--camp-muted);
  font-size: 0.85rem;
}

/* Promo / notice banner — flat navy-accented strip */
.camp-promo-banner,
.camp-notice {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding: 0.9rem 1.25rem;
  background: var(--camp-soft);
  border: 1px solid var(--camp-border);
  border-radius: 12px;
  color: var(--camp-text);
}

.camp-promo-banner p,
.camp-notice p {
  margin: 0;
  font-size: 0.95rem;
}

.camp-promo-banner strong,
.camp-notice strong {
  color: var(--camp-navy);
}

.camp-promo-badge {
  display: inline-block;
  padding: 0.3rem 0.7rem;
  color: #fff;
  background: var(--camp-navy);
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

/* Info grid — flat cards matching the hub */
.camp-info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
  margin-bottom: 2rem;
}

.camp-info-card {
  display: flex;
  flex-direction: column;
  padding: 1.5rem 1.4rem 1.4rem;
  background: var(--camp-bg);
  border: 1px solid var(--camp-border);
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(11, 31, 63, 0.06);
}

.camp-info-header {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  margin: 0 0 0.9rem;
  padding: 0;
  background: transparent;
  border-bottom: none;
}

.camp-info-icon {
  font-size: 1.15rem;
}

.camp-info-header h2 {
  margin: 0;
  color: var(--camp-navy);
  font-size: 1.2rem;
  font-weight: 800;
  line-height: 1.25;
}

/* Details list — compact, no inner padding */
.camp-details-list {
  margin: 0;
  padding: 0.6rem 0;
  list-style: none;
  border-top: 1px solid var(--camp-border);
  border-bottom: 1px solid var(--camp-border);
}

.camp-details-list li {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.5rem;
  padding: 0.35rem 0;
  border-bottom: none;
  font-size: 0.86rem;
  line-height: 1.4;
}

.detail-label {
  color: var(--camp-muted);
  font-weight: 600;
}

.detail-value {
  color: var(--camp-text);
  font-weight: 650;
}

/* Schedule — same compact look as details */
.camp-schedule {
  padding: 0.6rem 0;
  border-top: 1px solid var(--camp-border);
  border-bottom: 1px solid var(--camp-border);
}

.schedule-row {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 0.6rem;
  padding: 0.3rem 0;
  font-size: 0.86rem;
  line-height: 1.4;
}

.schedule-row .time {
  color: var(--camp-blue);
  font-weight: 700;
}

.schedule-row .activity {
  color: var(--camp-text);
}

/* Topics */
.camp-topics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.camp-topic-card {
  padding: 1.1rem;
  background: var(--camp-bg);
  border: 1px solid var(--camp-border);
  border-radius: 12px;
  text-align: center;
}

.camp-topic-card h3 {
  margin: 0 0 0.4rem;
  color: var(--camp-navy);
  font-size: 1rem;
  font-weight: 700;
}

.camp-topic-card p {
  margin: 0;
  color: var(--camp-muted);
  font-size: 0.875rem;
}

/* Store section */
.camp-store-section {
  margin-bottom: 2rem;
}

.camp-store-header {
  margin-bottom: 1.25rem;
  text-align: center;
}

.camp-store-header h2 {
  margin: 0 0 0.4rem;
  color: var(--camp-navy);
  font-size: 1.5rem;
  font-weight: 850;
}

.camp-store-header p {
  margin: 0 auto;
  color: var(--camp-muted);
  font-size: 0.95rem;
}

.camp-store-header a {
  color: var(--camp-blue);
  font-weight: 600;
}

.camp-store-container {
  min-height: 400px;
  padding: 1.5rem;
  background: var(--camp-soft) !important;
  border: 1px solid var(--camp-border) !important;
  border-radius: 14px;
}

/* Help banner — same style as camps hub */
.camp-help-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  padding: 1.25rem 1.75rem;
  background: var(--camp-soft);
  border: 1px solid var(--camp-border);
  border-radius: 14px;
}

.camp-help-content {
  text-align: left;
}

.camp-help-content strong {
  display: block;
  color: var(--camp-navy);
  font-size: 1rem;
  font-weight: 800;
}

.camp-help-content p {
  margin: 0.2rem 0 0;
  color: var(--camp-muted);
  font-size: 0.9rem;
}

.camp-help-btn {
  display: inline-flex;
  padding: 0.65rem 1.1rem;
  color: #fff;
  background: var(--camp-navy);
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
  transition: background 0.2s ease, transform 0.15s ease;
}

.camp-help-btn:hover {
  background: var(--camp-blue);
  color: #fff;
  text-decoration: none;
  transform: translateY(-1px);
}

/* ---- Compact variants (opt-in via class names) ---- */

/* Slim facts strip — 4 bold cells, no secondary lines */
.camp-quick-facts--slim .camp-fact { padding: 0.55rem 0.6rem; }
.camp-quick-facts--slim .camp-fact strong { font-size: 0.9rem; }

/* Primary CTA row above the info section */
.camp-cta-row { text-align: center; margin: 0 0 1rem; }
.camp-cta {
  display: inline-flex; align-items: center;
  padding: 0.65rem 1.25rem;
  background: #0866E8; color: #FFFFFF !important;
  border: 2px solid #0866E8; border-radius: 10px;
  font-size: 0.95rem; font-weight: 700; text-decoration: none !important;
  box-shadow: 0 2px 6px rgba(8, 102, 232, 0.15);
  transition: background 0.2s ease, transform 0.15s ease;
}
.camp-cta:hover { background: #0552c3; border-color: #0552c3; color: #FFFFFF !important; text-decoration: none !important; transform: translateY(-1px); }
.camp-cta:focus-visible { outline: 3px solid rgba(8, 102, 232, 0.5); outline-offset: 2px; }

/* Two-column 40 / 60 info split */
.camp-info-grid--split { grid-template-columns: minmax(0, 0.4fr) minmax(0, 0.6fr); gap: 1.25rem; }
.camp-info-grid--split .camp-info-card { padding: 1.75rem; }
.camp-info-grid--split .camp-info-header { margin: 0 0 1.25rem; padding: 0; background: transparent; border-bottom: none; }
.camp-info-grid--split .camp-info-header h2 { font-size: 1.4rem; font-weight: 800; color: var(--camp-navy); }
.camp-info-grid--split .camp-details-list { border-top: 1px solid #e3e9f1; border-bottom: 1px solid #e3e9f1; padding: 0.3rem 0; }
.camp-info-grid--split .camp-details-list li { padding: 0.5rem 0; }

/* Day summary + expandable timeline */
.camp-day-summary { margin: 0 0 1rem; color: var(--camp-muted); font-size: 0.95rem; line-height: 1.55; }
.camp-timeline { margin: 0; padding: 0.6rem 0 0; border-top: 1px solid #e3e9f1; }
.camp-timeline > summary { cursor: pointer; padding: 0.4rem 0; color: #0866E8; font-size: 0.92rem; font-weight: 700; list-style: none; }
.camp-timeline > summary::before { content: "▸ "; display: inline-block; margin-right: 0.2rem; transition: transform 0.15s ease; }
.camp-timeline[open] > summary::before { transform: rotate(90deg); }
.camp-timeline[open] > summary { margin-bottom: 0.4rem; }
.camp-timeline .camp-schedule { padding: 0; border: none; }
.camp-timeline .schedule-row {
  display: grid; grid-template-columns: 80px 1fr; gap: 0.75rem;
  padding: 0.3rem 0; font-size: 0.9rem; line-height: 1.4;
  border-top: 1px solid #f0f3f8;
}
.camp-timeline .schedule-row:first-child { border-top: none; }
.camp-timeline .time { color: var(--camp-blue); font-weight: 700; font-variant-numeric: tabular-nums; }
.camp-timeline .activity { color: var(--camp-text); }

@media (max-width: 760px) {
  .camp-info-grid--split { grid-template-columns: 1fr; }
  .camp-quick-facts--slim { grid-template-columns: repeat(2, 1fr); }
}

/* Responsive */
@media (max-width: 900px) {
  .camp-info-grid:not(.camp-info-grid--split) {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 650px) {
  .camp-quick-facts {
    grid-template-columns: repeat(2, 1fr);
  }

  .camp-promo-banner,
  .camp-notice {
    flex-direction: column;
    text-align: center;
  }

  .camp-help-banner {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
  }

  .camp-help-content {
    text-align: center;
  }
}

@media (max-width: 400px) {
  .camp-quick-facts {
    grid-template-columns: 1fr;
  }
}
</style>

{{end}}
