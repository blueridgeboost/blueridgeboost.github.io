<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default `en-US` }}" itemscope itemtype="http://schema.org/WebPage">

<head>
	{{ partial "head.html" . }}
	{{ if hugo.IsProduction }}
		{{ partialCached "style.html" . }}
	{{ else }}
		{{ partial "style.html" . }}
	{{ end }}
</head>

<body{{ with .Params.body_class }} class="{{ . }}"{{ end }}>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://load.metrics.blueridgeboost.com/ns.html?id=GTM-W5LVLXL5" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

	{{ partial "header.html" . }}

	{{ partial "secondbar.html" . }}

	<main>
		{{ block "main" . }}{{ end }}
	</main>

	{{ partial "footer.html" . }}

	{{ partial "script.html" . }}
</body>

</html>
