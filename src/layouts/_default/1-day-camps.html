{{ define "main" }}

{{ partial "page-header.html" . }}

<section class="section test-page-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-11 mx-auto">
        <!-- Big Centered Buy Now Button -->
        <div class="buy-now-hero">
          <a href="#camp-store" class="buy-now-btn" id="buyNowBtn">
            <span class="buy-now-icon">🛒</span>
            Buy Now!
          </a>
        </div>
        <div class="content test-page-content">{{ .Content }}</div>
      </div>
    </div>
  </div>
</section>

<style>
/* ==========================================================================
   Test Page - Improved Camp Layout
   ========================================================================== */

.test-page-section {
  padding-block: clamp(1.5rem, 4vw, 2.5rem);
  transition: background-color 0.3s ease;
}

.test-page-content {
  --camp-blue: #0b6ff4;
  --camp-blue-dark: #0758c7;
  --camp-navy: #0b1f3f;
  --camp-green: #119b73;
  --camp-orange: #f08a25;
  --camp-text: #2e4567;
  --camp-muted: #60728c;
  --camp-border: #dbe5f0;
  --camp-soft: #f4f8fd;
  --camp-bg: #ffffff;
}

/* Big Centered Buy Now Hero */
.buy-now-hero {
  display: flex;
  justify-content: center;
  margin-bottom: 2rem;
}

/* Buy Now Button - Large and prominent */
.buy-now-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 1.1rem 2.5rem;
  color: #ffffff;
  background: linear-gradient(135deg, #f08a25, #e95b85);
  border: none;
  border-radius: 999px;
  font-size: 1.35rem;
  font-weight: 800;
  text-decoration: none;
  box-shadow: 0 8px 28px rgba(240, 138, 37, 0.4);
  transition: all 0.2s ease;
  animation: pulse-glow 2s ease-in-out infinite;
}

.buy-now-btn:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 12px 36px rgba(240, 138, 37, 0.5);
  text-decoration: none;
  color: #ffffff;
}

.buy-now-icon {
  font-size: 1.4rem;
}

@keyframes pulse-glow {
  0%, 100% {
    box-shadow: 0 8px 28px rgba(240, 138, 37, 0.4);
  }
  50% {
    box-shadow: 0 8px 36px rgba(240, 138, 37, 0.55);
  }
}

/* Quick Facts Bar - Bigger */
.camp-quick-facts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  margin-bottom: 1.75rem;
  background: var(--camp-border);
  border: 1px solid var(--camp-border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(11, 31, 63, 0.1);
}

.camp-fact {
  padding: 1.5rem 1.25rem;
  text-align: center;
  background: var(--camp-bg);
}

.camp-fact strong {
  display: block;
  color: var(--camp-navy);
  font-size: 1.2rem;
  font-weight: 850;
}

.camp-fact span {
  display: block;
  margin-top: 0.35rem;
  color: var(--camp-muted);
  font-size: 0.88rem;
}

/* Promo Banner - Centered */
.camp-promo-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 1.75rem;
  padding: 1.1rem 1.5rem;
  background: linear-gradient(135deg, rgba(17, 155, 115, 0.08), rgba(11, 111, 244, 0.05));
  border: 1px solid rgba(17, 155, 115, 0.2);
  border-radius: 12px;
}

.camp-promo-badge {
  display: inline-block;
  padding: 0.4rem 0.8rem;
  color: #fff;
  background: var(--camp-green);
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.camp-promo-banner p {
  margin: 0;
  color: var(--camp-text);
  font-size: 1rem;
}

.camp-promo-banner strong {
  color: var(--camp-green);
}

/* Info Grid */
.camp-info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
  margin-bottom: 2.5rem;
}

.camp-info-card {
  background: var(--camp-bg);
  border: 1px solid var(--camp-border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(11, 31, 63, 0.06);
}

.camp-info-header {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 1rem 1.25rem;
  background: var(--camp-soft);
  border-bottom: 1px solid var(--camp-border);
}

.camp-info-icon {
  font-size: 1.1rem;
}

.camp-info-header h2 {
  margin: 0;
  color: var(--camp-navy);
  font-size: 1rem;
  font-weight: 800;
}

/* Details List */
.camp-details-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.camp-details-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid rgba(219, 229, 240, 0.6);
}

.camp-details-list li:last-child {
  border-bottom: none;
}

.detail-label {
  color: var(--camp-muted);
  font-size: 0.88rem;
}

.detail-value {
  color: var(--camp-navy);
  font-size: 0.88rem;
  font-weight: 700;
}

/* Schedule */
.camp-schedule {
  padding: 0.5rem 0;
}

.schedule-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.6rem 1.25rem;
}

.schedule-row .time {
  flex: 0 0 50px;
  color: var(--camp-blue);
  font-size: 0.82rem;
  font-weight: 700;
}

.schedule-row .activity {
  color: var(--camp-text);
  font-size: 0.88rem;
}

/* Store Section */
.camp-store-section {
  margin-bottom: 2rem;
}

.camp-store-header {
  text-align: center;
  margin-bottom: 1.5rem;
}

.camp-store-header h2 {
  margin: 0 0 0.5rem;
  color: var(--camp-navy);
  font-size: 1.75rem;
  font-weight: 850;
  text-align: center;
}

.camp-store-header p {
  margin: 0 auto;
  color: var(--camp-muted);
  font-size: 0.95rem;
  text-align: center;
}

.camp-store-header a {
  color: var(--camp-blue);
  font-weight: 600;
}

.camp-store-container {
  background: #f4f8fd !important;
  border: 1px solid #dbe5f0 !important;
  border-radius: 16px;
  padding: 1.5rem;
  min-height: 400px;
}

/* Help Banner - Centered with proper text colors */
.camp-help-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  padding: 1.5rem 2rem;
  background: linear-gradient(135deg, #0b1f3f, #173763);
  border-radius: 14px;
}

.camp-help-content {
  text-align: center;
}

.camp-help-content strong {
  display: block;
  color: #ffffff;
  font-size: 1.1rem;
  font-weight: 800;
}

.camp-help-content p {
  margin: 0.3rem 0 0;
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.92rem;
}

.camp-help-btn {
  display: inline-flex;
  padding: 0.75rem 1.35rem;
  color: #0b1f3f;
  background: #fff;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
  transition: background 0.2s ease, transform 0.2s ease;
}

.camp-help-btn:hover {
  background: #edf6ff;
  transform: translateY(-2px);
  text-decoration: none;
  color: #0758c7;
}

/* Responsive */
@media (max-width: 900px) {
  .camp-info-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 650px) {
  .buy-now-btn {
    padding: 0.9rem 2rem;
    font-size: 1.15rem;
  }

  .camp-quick-facts {
    grid-template-columns: repeat(2, 1fr);
  }

  .camp-promo-banner {
    flex-direction: column;
    text-align: center;
  }

  .camp-help-banner {
    flex-direction: column;
    gap: 1rem;
  }
}

@media (max-width: 400px) {
  .camp-quick-facts {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
// Smooth scroll for Buy Now button
document.addEventListener('DOMContentLoaded', function() {
  const buyNowBtn = document.getElementById('buyNowBtn');
  if (buyNowBtn) {
    buyNowBtn.addEventListener('click', function(e) {
      e.preventDefault();
      const target = document.getElementById('camp-store');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  }
});
</script>

{{end}}
